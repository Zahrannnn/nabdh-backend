networks:
  nabdh-network:
    driver: bridge

volumes:
  mongo-data:
  minio-data:

services:
  mongo:
    image: mongo:7
    container_name: nabdh-mongo
    restart: unless-stopped
    networks:
      - nabdh-network
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: nabdh
      MONGO_INITDB_ROOT_PASSWORD: nabdh_dev
      MONGO_INITDB_DATABASE: nabdh
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  minio:
    image: minio/minio
    container_name: nabdh-minio
    restart: unless-stopped
    networks:
      - nabdh-network
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: nabdh_minio
      MINIO_ROOT_PASSWORD: nabdh_minio_secret
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  api:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile
      target: production
    container_name: nabdh-api
    restart: unless-stopped
    networks:
      - nabdh-network
    ports:
      - "3000:3000"
    env_file:
      - ../../.env
    environment:
      MONGODB_URI: mongodb://nabdh:nabdh_dev@mongo:27017/nabdh?authSource=admin
    depends_on:
      mongo:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
