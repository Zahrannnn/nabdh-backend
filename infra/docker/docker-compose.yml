version: "3.8"

networks:
  nabdh-network:
    driver: bridge

volumes:
  postgres-data:
  minio-data:

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: nabdh-postgres
    restart: unless-stopped
    networks:
      - nabdh-network
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nabdh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nabdh_dev}
      POSTGRES_DB: ${POSTGRES_DB:-nabdh}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nabdh} -d ${POSTGRES_DB:-nabdh}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  minio:
    image: minio/minio
    container_name: nabdh-minio
    restart: unless-stopped
    networks:
      - nabdh-network
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-nabdh_minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-nabdh_minio_secret}
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  api:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile
      target: production
    container_name: nabdh-api
    restart: unless-stopped
    networks:
      - nabdh-network
    ports:
      - "3000:3000"
    env_file:
      - ../../.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-nabdh}:${POSTGRES_PASSWORD:-nabdh_dev}@postgres:5432/${POSTGRES_DB:-nabdh}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
